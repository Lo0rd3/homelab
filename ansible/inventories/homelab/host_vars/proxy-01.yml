---
# Host-specific values for proxy-01.
ansible_user: debian

# Expose lightweight host metrics to the monitoring VM.
node_exporter_web_listen_host: 0.0.0.0

nginx_tls_secret_directory: /etc/nginx/secrets
nginx_tls_certificate_path: /etc/nginx/secrets/idios.crt
nginx_tls_private_key_path: /etc/nginx/secrets/idios.key

nginx_vhosts:
  - server_name: proxmox.idios
    upstream_url: https://192.168.1.1:8006
    websocket: true

  - server_name: adguard.idios
    upstream_url: http://192.168.1.252

  - server_name: booklore.idios
    upstream_url: http://192.168.1.51:6060

  - server_name: vault.idios
    # Preserve the upstream origin expected by Vault over the Cloudflare Tunnel.
    upstream_url: https://vault.lo0r.de
    proxy_host: vault.lo0r.de
    x_forwarded_host: vault.lo0r.de
    x_forwarded_proto: https
    proxy_ssl_server_name: true
    proxy_ssl_name: vault.lo0r.de
    websocket: true
